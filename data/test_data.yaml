# 注册接口 - 正向用例
register_success:
  email: "eve.holt@reqres.in"
  password: "pistol"
  expected_status: 200

# 登录接口 - 正向用例
login_success:
  email: "eve.holt@reqres.in"
  password: "pistol"
  expected_status: 200

